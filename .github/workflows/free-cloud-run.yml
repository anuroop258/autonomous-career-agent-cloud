name: Free Cloud Browser Run
run-name: CareerAgent / ${{ inputs.operation }} / ${{ inputs.portal }} / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Cloud operation to execute
        required: true
        default: job_search
        type: choice
        options: [job_search, tailor_resume]
      job_ref:
        description: Existing job reference for resume tailoring (portal:id)
        required: false
        default: ''
        type: string
      portal:
        description: Job portal to run
        required: true
        type: choice
        options:
          - naukri
          - indeed
          - linkedin
          - shine
          - timesjobs
          - glassdoor
      max_jobs:
        description: Maximum target applications for this run (1-5)
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      request_id:
        description: Unique ID supplied by the Cloudflare control page
        required: true
        type: string
      confirm_submit:
        description: Explicitly confirm that the selected agent may submit applications
        required: true
        default: 'NO'
        type: choice
        options: ['NO', 'YES']

permissions:
  contents: read

concurrency:
  group: career-agent-cloud-browser
  cancel-in-progress: false

jobs:
  run-agent:
    if: ${{ inputs.operation == 'tailor_resume' || inputs.confirm_submit == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out application code
        uses: actions/checkout@v4

      - name: Register GitHub run with Cloudflare
        env:
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
        run: python tools/report_cloud_status.py --status running --error 'GitHub Actions runner registered; preparing private data checkout'

      - name: Check out private encrypted data bundle
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CAREER_AGENT_DATA_REPO }}
          ref: main
          token: ${{ secrets.CAREER_AGENT_DATA_TOKEN }}
          path: private-data
          persist-credentials: true

      - name: Validate required settings
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.CAREER_AGENT_PRIVATE_BUNDLE_KEY }}
          REPORT_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          REPORT_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          DATA_REPO: ${{ vars.CAREER_AGENT_DATA_REPO }}
          DATA_TOKEN: ${{ secrets.CAREER_AGENT_DATA_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          JOB_REF: ${{ inputs.job_ref }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" || { echo 'Missing CAREER_AGENT_PRIVATE_BUNDLE_KEY secret'; exit 1; }
          test -n "$REPORT_KEY" || { echo 'Missing CLOUD_CONTROL_API_KEY secret'; exit 1; }
          test -n "$REPORT_BASE" || { echo 'Missing CLOUD_CONTROL_API_BASE repository variable'; exit 1; }
          test -n "$DATA_REPO" || { echo 'Missing CAREER_AGENT_DATA_REPO repository variable'; exit 1; }
          test -n "$DATA_TOKEN" || { echo 'Missing CAREER_AGENT_DATA_TOKEN secret'; exit 1; }
          test -f private-data/career-agent-private.enc || { echo 'Private repo must contain career-agent-private.enc'; exit 1; }
          if [[ "$OPERATION" == 'tailor_resume' ]]; then test -n "$JOB_REF" || { echo 'job_ref is required for resume tailoring'; exit 1; }; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python, Playwright, Chromium and LaTeX dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r webapp/backend/requirements.txt
          if [[ '${{ inputs.operation }}' == 'job_search' ]]; then python -m playwright install --with-deps chromium; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Restore encrypted private profile, resumes, database and browser session
        id: restore_data
        env:
          CAREER_AGENT_PRIVATE_BUNDLE_KEY: ${{ secrets.CAREER_AGENT_PRIVATE_BUNDLE_KEY }}
        run: python tools/private_bundle.py decrypt --input private-data/career-agent-private.enc --root . --key-env

      - name: Apply a strict per-run target limit
        if: ${{ inputs.operation == 'job_search' }}
        run: python tools/set_run_limit.py --portal '${{ inputs.portal }}' --max-jobs '${{ inputs.max_jobs }}'

      - name: Start isolated headless Chromium
        if: ${{ inputs.operation == 'job_search' }}
        run: python tools/start_cloud_browser.py --portal '${{ inputs.portal }}'

      - name: Restore the encrypted portal login session
        if: ${{ inputs.operation == 'job_search' }}
        run: python tools/restore_cloud_session.py --portal '${{ inputs.portal }}' --state 'cloud_private/sessions/${{ inputs.portal }}.json'

      - name: Run the existing portal agent
        id: run_agent
        if: ${{ inputs.operation == 'job_search' }}
        continue-on-error: true
        env:
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
          CAREER_AGENT_PORTAL: ${{ inputs.portal }}
          CAREER_AGENT_MAX_JOBS: ${{ inputs.max_jobs }}
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          CAREER_AGENT_PRIVATE_BUNDLE_KEY: ${{ secrets.CAREER_AGENT_PRIVATE_BUNDLE_KEY }}
          MAX_APPLICATIONS: ${{ inputs.max_jobs }}
          OLLAMA_ENABLED: '0'
        run: python tools/run_cloud_agent.py

      - name: Tailor the selected resume using the existing engine
        id: run_tailor
        if: ${{ inputs.operation == 'tailor_resume' }}
        continue-on-error: true
        env:
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
          CAREER_AGENT_JOB_REF: ${{ inputs.job_ref }}
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
        run: python tools/run_cloud_tailor.py

      - name: Publish current dashboard data to Cloudflare D1
        id: sync_dashboard
        if: ${{ always() && steps.restore_data.outcome == 'success' }}
        env:
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
        run: python tools/publish_dashboard_data.py --key-env

      - name: Save updated encrypted state back to the private data repository
        id: save_state
        if: ${{ always() && steps.restore_data.outcome == 'success' }}
        env:
          CAREER_AGENT_PRIVATE_BUNDLE_KEY: ${{ secrets.CAREER_AGENT_PRIVATE_BUNDLE_KEY }}
        run: |
          set -euo pipefail
          python tools/private_bundle.py encrypt --root . --output private-data/career-agent-private.enc --key-env
          cd private-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add career-agent-private.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted Career Agent state'
            git push
          else
            echo 'Encrypted private state did not change.'
          fi

      - name: Report setup failure to control panel
        if: ${{ failure() && steps.run_agent.outcome == 'skipped' && steps.run_tailor.outcome == 'skipped' }}
        env:
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
        run: python tools/report_cloud_status.py --status failed --error 'Workflow setup failed before the portal agent started. Open GitHub Actions logs for the failing step.'

      - name: Report encrypted-state persistence failure
        if: ${{ always() && steps.save_state.outcome == 'failure' }}
        env:
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
        run: python tools/report_cloud_status.py --status failed --error 'The agent may have run, but the encrypted private state could not be saved. Do not start another run until persistence is repaired.'

      - name: Mark workflow failed if the selected operation failed
        if: ${{ steps.run_agent.outcome == 'failure' || steps.run_tailor.outcome == 'failure' }}
        run: exit 1

      - name: Report workflow cancellation to control panel
        if: ${{ always() && cancelled() }}
        env:
          CLOUD_CONTROL_API_BASE: ${{ vars.CLOUD_CONTROL_API_BASE }}
          CLOUD_CONTROL_API_KEY: ${{ secrets.CLOUD_CONTROL_API_KEY }}
          CAREER_AGENT_TASK_ID: ${{ inputs.request_id }}
        run: python tools/report_cloud_status.py --status cancelled --error 'GitHub Actions workflow was cancelled'
